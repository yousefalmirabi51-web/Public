services:
  postgres:
    image: postgres:16-alpine
    container_name: almazaq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-almazaq_ops}
      POSTGRES_USER: ${POSTGRES_USER:-almazaq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_securely}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-almazaq_user} -d ${POSTGRES_DB:-almazaq_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: almazaq_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-replace_with_strong_random_secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-almazaq_user}:${POSTGRES_PASSWORD:-change_me_securely}@postgres:5432/${POSTGRES_DB:-almazaq_ops}
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: almazaq_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
